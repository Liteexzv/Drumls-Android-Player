<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121212">
<title>Wave</title>
<style>
:root{--acc:#1ed760;--bg:#121212;--surf:#1d1d1d;--raise:#2a2a2a;--txt:#fff;--sub:rgba(255,255,255,.6);--bd:rgba(255,255,255,.08);--onacc:#000;--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.4,.64,1)}
body.t-light{--bg:#f6f6f6;--surf:#fff;--raise:#e8e8e8;--txt:#111;--sub:rgba(0,0,0,.55);--bd:rgba(0,0,0,.08)}
body.t-amoled{--bg:#000;--surf:#0e0e0e;--raise:#1c1c1c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:15px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;user-select:none;-webkit-user-select:none;transition:background-color .5s,color .5s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .18s var(--spring),opacity .2s,background-color .3s,color .3s}
button:active{transform:scale(.92)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{display:block;flex:none}
#app{position:fixed;inset:0}
#top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:background-color .5s}
#ttl{flex:1;font-size:22px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:4px;min-width:0}
#ttl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#screen{position:absolute;inset:0;overflow-y:auto;padding:calc(60px + env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.view{animation:fade .38s var(--ease) both}
.view.push{animation:push .42s var(--ease) both}.view.pop{animation:pop .42s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
@keyframes push{from{opacity:0;transform:translateX(36px)}}
@keyframes pop{from{opacity:0;transform:translateX(-36px)}}
.st{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*28ms)}
.still .st{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--sub);flex:none}
.ic.t{color:var(--txt)}
.av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--onacc);font-weight:700;font-size:14px;display:grid;place-items:center;margin-right:6px;transition:background-color .5s}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 22px}
.q{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--txt) 7%,transparent);border-radius:6px;overflow:hidden;height:52px;font-size:13px;font-weight:700;text-align:left;padding-right:8px}
.q .c{width:52px;height:52px;flex:none;display:grid;place-items:center;color:#fff}
.q span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-size:18px;letter-spacing:-.2px;margin:0 0 6px}
.tr{display:flex;align-items:center;gap:12px;height:60px;width:100%;text-align:left;border-radius:8px;transition:background-color .25s}
.tr:active{background:var(--raise);transform:none}
.tr .c{width:46px;height:46px;border-radius:5px;flex:none;display:grid;place-items:center;font-size:20px;color:#fff;position:relative;overflow:hidden}
.tr .m{flex:1;min-width:0}
.tr b,.tr small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr b{font-weight:500;transition:color .3s}.tr small{color:var(--sub);font-size:13px}
.tr.on b{color:var(--acc)}
.eqz{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:13px;opacity:0;transition:opacity .3s}
.tr.on .eqz{opacity:1}
.eqz i{width:3px;height:18px;background:var(--acc);border-radius:2px;transform-origin:bottom;animation:eqb .9s ease-in-out infinite;animation-play-state:paused}
.eqz i:nth-child(2){animation-delay:-.3s}.eqz i:nth-child(3){animation-delay:-.6s}
body.playing .tr.on .eqz i{animation-play-state:running}
@keyframes eqb{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--raise);border-radius:10px;padding:0 6px 0 12px;height:44px;margin:4px 0 12px;color:var(--sub);transition:background-color .5s}
.searchbox input{flex:1;background:none;border:0;outline:none;color:var(--txt);font:inherit;min-width:0}
.empty{color:var(--sub);text-align:center;padding:28px 12px;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;border-radius:23px;background:var(--acc);color:var(--onacc);font-weight:700;margin:8px 0}
.seg{display:flex;gap:6px;margin:2px 0 12px}
.seg button{height:32px;padding:0 14px;border-radius:16px;background:var(--raise);font-size:13px}
.seg button.on{background:var(--acc);color:var(--onacc);font-weight:600}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin:0 0 8px}
.hero .c{width:180px;height:180px;border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.45);display:grid;place-items:center;color:#fff;margin-bottom:14px;animation:coverIn .55s var(--ease) both}
@keyframes coverIn{from{opacity:0;transform:scale(.85)}}
.hero .c svg{width:56px;height:56px}
.hero h3{font-size:24px;letter-spacing:-.3px}.hero p{color:var(--sub);font-size:13px;margin-top:2px}
.bar2{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin:0 0 6px}
.bigplay{width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center}
/* mini */
#mini{position:absolute;left:8px;right:8px;bottom:calc(62px + env(safe-area-inset-bottom));height:56px;border-radius:10px;background:color-mix(in srgb,var(--mc,#444) 50%,#181818);display:flex;align-items:center;gap:10px;padding:0 4px 0 8px;overflow:hidden;color:#fff;transform:translateY(140%);opacity:0;transition:transform .5s var(--ease),opacity .4s,background-color .7s;touch-action:pan-y;z-index:3}
#mini.show{transform:none;opacity:1}
#mini .c{width:40px;height:40px;border-radius:5px;flex:none;display:grid;place-items:center;font-size:18px;transition:background .6s}
#mini .m{flex:1;min-width:0;transition:transform .35s var(--ease),opacity .25s}
#mini b,#mini small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
#mini small{opacity:.7;font-size:12px}
#mini .ic{color:#fff}
#mini .pr{position:absolute;left:8px;right:8px;bottom:0;height:2px;background:rgba(255,255,255,.18);border-radius:1px;overflow:hidden}
#mini .pr i{display:block;height:100%;background:#fff;width:100%;transform-origin:left;transform:scaleX(0)}
.spd{font-size:11px;font-weight:700;background:rgba(255,255,255,.18);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px;display:inline-block;animation:pop2 .4s var(--spring)}
@keyframes pop2{from{transform:scale(.4);opacity:0}}
nav{position:absolute;left:0;right:0;bottom:0;height:calc(58px + env(safe-area-inset-bottom));display:flex;padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(0deg,var(--bg) 65%,transparent);z-index:2}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--sub);gap:3px}
nav button svg{transition:transform .35s var(--spring)}
nav button.on{color:var(--txt)}nav button.on svg{transform:scale(1.12)}
/* toggle icons */
.sw2{position:relative;display:grid;place-items:center}
.sw2>span{grid-area:1/1;transition:opacity .25s,transform .35s var(--spring);display:grid;place-items:center}
.sw2 .b{opacity:0;transform:scale(.4) rotate(-45deg)}
.sw2.alt .a{opacity:0;transform:scale(.4) rotate(45deg)}.sw2.alt .b{opacity:1;transform:none}
/* full player */
#full{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(180deg,color-mix(in srgb,var(--fc,#444) 65%,var(--bg)) 0%,var(--bg) 72%);transform:translateY(100%);transition:transform .55s var(--ease),background .8s;will-change:transform;touch-action:none}
#full.show{transform:none}
#full>*{transition:opacity .45s var(--ease),transform .55s var(--ease)}
#full:not(.show)>*{opacity:0;transform:translateY(30px)}
#full.show>*:nth-child(2){transition-delay:.05s}#full.show>*:nth-child(3){transition-delay:.1s}#full.show>*:nth-child(4){transition-delay:.13s}#full.show>*:nth-child(5){transition-delay:.16s}#full.show>*:nth-child(6){transition-delay:.19s}
.fh{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.fh span{flex:1;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:.85}
.fwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px 0}
#fcover{width:min(86vw,48vh,380px);aspect-ratio:1;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.45);display:grid;place-items:center;font-size:86px;transition:transform .6s var(--spring),background .6s,box-shadow .6s;touch-action:pan-y}
#full.paused #fcover{transform:scale(.88);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.swapL{animation:swL .45s var(--ease)}.swapR{animation:swR .45s var(--ease)}
@keyframes swL{0%{opacity:0;transform:translateX(40px) scale(.96)}}
@keyframes swR{0%{opacity:0;transform:translateX(-40px) scale(.96)}}
.fmeta{display:flex;align-items:center;gap:8px;margin-top:6px}
.fmeta div{flex:1;min-width:0}
.fmeta h3{font-size:22px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta p{color:var(--sub);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fLike.on{color:var(--acc)}
.beat{animation:beat .45s var(--spring)}
@keyframes beat{40%{transform:scale(1.35)}}
.prog{position:relative;height:24px;display:flex;align-items:center;margin-top:10px;touch-action:none;cursor:pointer}
.prog .tk{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:color-mix(in srgb,var(--txt) 22%,transparent);overflow:hidden;transition:height .2s}
.prog .tk i{position:absolute;inset:0;background:var(--txt);transform-origin:left;transform:scaleX(0)}
.prog .th{position:absolute;left:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--txt);transform:scale(0);transition:transform .25s var(--spring)}
.prog:active .tk,.prog.drag .tk{height:6px}.prog:active .th,.prog.drag .th,#full .prog .th{transform:scale(1)}
.time{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.ctr{display:flex;align-items:center;justify-content:space-between;margin:10px 0 14px}
.ctr .ic{color:var(--txt);width:46px;height:46px}
.ctr .ic.on{color:var(--acc)}
.pp{width:66px;height:66px;border-radius:50%;background:var(--txt);color:var(--bg)}
.fbot{display:flex;align-items:center;justify-content:center}
#spBtn{height:36px;padding:0 16px;border-radius:18px;background:color-mix(in srgb,var(--txt) 12%,transparent);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
#spBtn.mod{background:var(--acc);color:var(--onacc)}
#spBtn small{font-weight:500;opacity:.8;font-size:12px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:10;visibility:hidden;transition:visibility 0s .45s}
.sheet.show{visibility:visible;transition:none}
.sheet .ov{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .4s}
.sheet.show .ov{opacity:1}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;background:var(--surf);border-radius:16px 16px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:84vh;overflow-y:auto;transform:translateY(100%);transition:transform .45s var(--ease),background-color .5s}
.sheet.show .pn{transform:none}
.pn::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--txt) 20%,transparent);margin:0 auto 12px}
.pn h4{font-size:17px;margin-bottom:10px}
.mi{display:flex;align-items:center;gap:16px;width:100%;height:50px;text-align:left;font-size:15px}
.mi svg{color:var(--sub)}
.mi:active{transform:none;opacity:.6}
/* speed mixer */
.spv{text-align:center;padding:6px 0 2px}
.spv b{font-size:52px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
.spv b small{font-size:26px;font-weight:700;opacity:.6;margin-left:2px}
.spv p{color:var(--acc);font-weight:600;font-size:14px;height:20px;margin-top:6px;transition:color .3s}
.spk{position:relative;height:44px;margin:14px 6px 0;touch-action:none;cursor:pointer}
.spk .tk{position:absolute;left:0;right:0;top:20px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--txt) 18%,transparent)}
.spk .fl{position:absolute;top:20px;height:4px;border-radius:2px;background:var(--acc)}
.spk .tick{position:absolute;top:16px;width:2px;height:12px;margin-left:-1px;border-radius:1px;background:color-mix(in srgb,var(--txt) 30%,transparent)}
.spk .kn{position:absolute;top:10px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .25s var(--spring)}
.spk.drag .kn{transform:scale(1.2)}
.spk.anim .kn,.spk.anim .fl{transition:left .45s var(--ease),width .45s var(--ease),right .45s var(--ease),transform .25s var(--spring)}
.spl{position:relative;height:34px;font-size:12px;color:var(--sub);margin:0 6px}
.spl button{position:absolute;top:0;padding:6px 4px;font-variant-numeric:tabular-nums;transform:translateX(-50%)}
.spl button:active{transform:translateX(-50%) scale(.9)}
.spl button.on{color:var(--acc);font-weight:700}
.row2{display:flex;align-items:center;justify-content:space-between;height:52px;font-size:14px;border-top:1px solid var(--bd);margin-top:14px}
.row2 small{display:block;color:var(--sub);font-size:12px}
.tg{width:44px;height:26px;border-radius:13px;background:var(--raise);position:relative;flex:none;transition:background-color .3s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .35s var(--spring)}
.tg.on{background:var(--acc)}.tg.on::after{transform:translateX(18px)}
.tg:active{transform:none}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thm{height:56px;border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;font-weight:600;border:2px solid transparent}
.thm.on{border-color:var(--acc)}
.thm i{width:16px;height:16px;border-radius:50%}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-20px) scale(.9);background:var(--txt);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s,transform .45s var(--spring);pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
@media (min-width:700px){#screen{padding-left:max(16px,calc(50% - 320px));padding-right:max(16px,calc(50% - 320px))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <div id="screen"></div>
 <header id="top"><div id="ttl"></div><div id="tb" style="display:flex"></div></header>
 <div id="mini" role="button" aria-label="Открыть плеер">
  <div class="c"></div><div class="m"><b></b><small></small></div>
  <button class="ic sw2" id="mPlay" aria-label="Играть"></button>
  <div class="pr"><i></i></div>
 </div>
 <nav id="nav"></nav>
</div>
<section id="full" class="paused" aria-label="Плеер">
 <div class="fh"><button class="ic t" id="fClose" aria-label="Свернуть"></button><span id="fSrc"></span><button class="ic t" id="fMore" aria-label="Ещё"></button></div>
 <div class="fwrap"><div id="fcover"></div></div>
 <div class="fmeta"><div id="fm"><h3 id="fTitle"></h3><p id="fArtist"></p></div><button class="ic t" id="fLike" aria-label="Нравится"></button></div>
 <div><div class="prog" id="prog"><div class="tk"><i></i></div><div class="th"></div></div><div class="time"><span id="tCur">0:00</span><span id="tDur">0:00</span></div></div>
 <div class="ctr">
  <button class="ic" id="shuf" aria-label="Перемешать"></button>
  <button class="ic" id="prev" aria-label="Назад"></button>
  <button class="pp sw2" id="play" aria-label="Играть"></button>
  <button class="ic" id="next" aria-label="Вперёд"></button>
  <button class="ic" id="rep" aria-label="Повтор"></button>
 </div>
 <div class="fbot"><button id="spBtn" aria-label="Скорость"></button></div>
</section>
<div class="sheet" id="sheet"><div class="ov"></div><div class="pn" id="pn"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="audio/*" multiple hidden>
<script>

function libBody(){const mine=tracks.filter(t=>!t.demo).map(t=>t.id);let h="",n=0;
 if(libF!=="mine")h+=`<div class="tr st" style="--i:${n++}" data-open="liked"><div class="c" style="background:${G("#450af5","#c4efd9")}">${I.heartF}</div><div class="m"><b>Любимые треки</b><small>Плейлист • ${ST.liked.filter(byId).length}</small></div></div>`+ST.playlists.map(p=>`<div class="tr st" style="--i:${n++}" data-openpl="${p.id}"><div class="c" style="background:${plCover(p)}"></div><div class="m"><b>${esc(p.name)}</b><small>Плейлист • ${p.ids.filter(byId).length}</small></div></div>`).join("");
 if(libF==="all")h+=`<div class="tr st" style="--i:${n++}" data-open="all"><div class="c" style="background:${G(...PAL[5])}"></div><div class="m"><b>Все треки</b><small>${tracks.length}</small></div></div>`;
 if(libF!=="pl")h+=libF==="mine"&&!mine.length?`<p class="empty st">Добавь музыку с телефона — она сохранится в приложении и будет играть без интернета</p><button class="btn st" data-act="import">${I.plus} Добавить музыку</button>`:(libF==="mine"?list(mine.slice().reverse(),"Мои файлы"):`<div class="tr st" style="--i:${n++}" data-open="mine"><div class="c" style="background:${G("#555","#222")}">${I.folder}</div><div class="m"><b>Мои файлы</b><small>${mine.length}</small></div></div>`);
 return h}
function searchRes(first){const ql=q.toLowerCase().trim(),ids=tracks.map(t=>t.id).filter(id=>{const t=T(byId(id));return(t.title+" "+t.artist).toLowerCase().includes(ql)});
 $("#sres").innerHTML=ql&&!ids.length?`<p class="empty st">Ничего не найдено</p>`:list(ids,"Поиск");markRows()}
function go(v,anim){view=v;sub=null;render(anim||"")}
function openSub(k,pl){const from=sub?sub.from:view;
 if(pl){const p=ST.playlists.find(x=>x.id===pl);if(!p)return;sub={pl,k:"pl",from,get title(){return p.name},cover:plCover(p),ids:()=>p.ids.filter(byId)}}
 else if(k==="liked")sub={k,from,title:"Любимые треки",cover:G("#450af5","#c4efd9"),icon:I.heartF,ids:()=>ST.liked.filter(byId)};
 else if(k==="mine")sub={k,from,title:"Мои файлы",cover:G("#555","#222"),icon:I.folder,ids:()=>tracks.filter(t=>!t.demo).map(t=>t.id).reverse()};
 else sub={k,from,title:"Все треки",cover:G(...PAL[5]),ids:()=>tracks.map(t=>t.id)};
 view="sub";render("push")}
function back(){if(view==="sub"){view=sub.from;sub=null;render("pop");return 1}if(view!=="home"){go("home","pop");return 1}return 0}

// ---------- шторка ----------
let sheetK=null,sheetA=null;
const mi=(a,ic,l,x)=>`<button class="mi" ${a}>${ic}<span style="flex:1">${l}</span>${x||""}</button>`;
function sheet(k,a){sheetK=k;sheetA=a;let h="";
 if(k==="more"){const t=T(byId(a));if(!t)return;h=`<div class="tr" style="margin-bottom:6px"><div class="c" style="background:${t.cover}">${t.emoji||""}</div><div class="m"><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div></div>`+
  mi(`data-like="${a}"`,isLiked(a)?I.heartF:I.heart,isLiked(a)?"Убрать из любимых":"В любимые")+mi(`data-addsheet="${a}"`,I.addpl,"Добавить в плейлист")+mi(`data-rename="${a}"`,I.edit,"Изменить название")+
  (sub&&sub.pl?mi(`data-rmfrom="${a}"`,I.close,"Убрать из плейлиста"):"")+(t.demo?"":mi(`data-delsong="${a}" style="color:#ff6b6b"`,I.trash,"Удалить"))}
 else if(k==="addto"){h=`<h4>Добавить в плейлист</h4>`+mi(`data-newpl="${a}"`,I.plus,"Новый плейлист")+ST.playlists.map(p=>mi(`data-addto="${p.id}" data-tid="${a}"`,`<span style="width:26px;height:26px;border-radius:5px;background:${plCover(p)};display:block"></span>`,esc(p.name),p.ids.includes(a)?`<span style="color:var(--acc)">✓</span>`:"")).join("")}
 else if(k==="plmenu"){const p=ST.playlists.find(x=>x.id===a);h=`<h4>${esc(p.name)}</h4>`+mi(`data-plrename="${a}"`,I.edit,"Переименовать")+mi(`data-delpl="${a}" style="color:#ff6b6b"`,I.trash,"Удалить плейлист")}
 else if(k==="themes"){h=`<h4>Тема</h4><div class="themes">${Object.entries(THEMES).map(([k2,[n,ac,bg]])=>`<button class="thm ${ST.theme===k2?"on":""}" data-theme="${k2}" style="background:${bg};color:${k2==="light"?"#111":"#fff"}"><i style="background:${ac}"></i>${n}</button>`).join("")}</div>`}
 else if(k==="speed"){h=speedHTML()}
 const pn=$("#pn"),open=$("#sheet").classList.contains("show");pn.innerHTML=h;if(!open)pn.scrollTop=0;$("#sheet").classList.add("show");if(k==="speed")initSpeed()}
function closeSheet(){$("#sheet").classList.remove("show");sheetK=null}
$("#sheet .ov").onclick=closeSheet;
// свайп шторки вниз
(()=>{const pn=$("#pn");let y0=null,dy=0;pn.addEventListener("touchstart",e=>{if(pn.scrollTop>0||e.target.closest(".spk"))return;y0=e.touches[0].clientY;dy=0;pn.style.transition="none"},{passive:true});
 pn.addEventListener("touchmove",e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);pn.style.transform=`translateY(${dy}px)`},{passive:true});
 pn.addEventListener("touchend",()=>{if(y0==null)return;pn.style.transition="";pn.style.transform="";if(dy>90)closeSheet();y0=null})})();

// ---------- микшер скорости ----------
const MARKS=[.5,.75,1,1.25,1.5,2];
const pos=v=>(v-.5)/1.5*100;
function speedHTML(){return`<div class="spv"><b id="spNum">${ST.speed.toFixed(2)}<small>×</small></b><p id="spName">${SPN(ST.speed)}</p></div>
 <div class="spk anim" id="spk"><div class="tk"></div><div class="fl" id="spFill"></div>${MARKS.map(m=>`<div class="tick" style="left:${pos(m)}%"></div>`).join("")}<div class="kn" id="spKn"></div></div>
 <div class="spl">${MARKS.map(m=>`<button data-sp="${m}" class="${ST.speed===m?"on":""}" style="left:${pos(m)}%">${m}×</button>`).join("")}</div>
 <div class="row2"><div>Сохранять тон<small>Выкл — звук ниже/выше, как в slowed и speed up</small></div><button class="tg ${ST.keepPitch?"on":""}" data-pitch aria-label="Сохранять тон"></button></div>`}
let shownSp=1,spRaf;
function drawSpeed(target,animate){const kn=$("#spKn");if(!kn)return;const p=pos(target),one=pos(1);kn.style.left=p+"%";const f=$("#spFill");f.style.left=Math.min(p,one)+"%";f.style.width=Math.abs(p-one)+"%";
 $("#spName").textContent=SPN(target);document.querySelectorAll("[data-sp]").forEach(b=>b.classList.toggle("on",+b.dataset.sp===target));
 cancelAnimationFrame(spRaf);if(!animate){shownSp=target;$("#spNum").firstChild.textContent=target.toFixed(2);return}
 const from=shownSp,t0=performance.now();(function st(now){const k=Math.min(1,(now-t0)/380),e=1-Math.pow(1-k,3);shownSp=from+(target-from)*e;const n=$("#spNum");if(!n)return;n.firstChild.textContent=shownSp.toFixed(2);if(k<1)spRaf=requestAnimationFrame(st)})(t0)}
function initSpeed(){shownSp=ST.speed;drawSpeed(ST.speed,false);const el=$("#spk");let last=ST.speed;
 scrub(el,(p,start)=>{el.classList.toggle("anim",!!start);let v=Math.round((.5+p*1.5)*20)/20;const near=MARKS.find(m=>Math.abs(m-v)<.03);if(near)v=near;if(v!==last){last=v;if(MARKS.includes(v))vib()}setSpeed(v);drawSpeed(v,!!start)},()=>el.classList.add("anim"))}

const THEMES={green:["Зелёная","#1ed760","#121212"],purple:["Фиолет","#a970ff","#121212"],pink:["Розовая","#ff5fa2","#121212"],blue:["Синяя","#3d9bff","#121212"],amoled:["AMOLED","#1ed760","#000"],light:["Светлая","#14a046","#f6f6f6"]};
function applyTheme(){const [,a,bg]=THEMES[ST.theme]||THEMES.green;document.body.classList.toggle("t-light",ST.theme==="light");document.body.classList.toggle("t-amoled",ST.theme==="amoled");document.documentElement.style.setProperty("--acc",a);document.documentElement.style.setProperty("--onacc",ST.theme==="light"?"#fff":"#000");document.querySelector('meta[name=theme-color]').content=bg}
window.appBack=()=>{if($("#sheet").classList.contains("show")){closeSheet();return 1}if($("#full").classList.contains("show")){closeFull();return 1}return back()};
const openFull=()=>{$("#full").classList.add("show")},closeFull=()=>{const f=$("#full");f.style.transform="";f.classList.remove("show")};

// ---------- события ----------
let lpT=null,lpFired=false;
document.addEventListener("pointerdown",e=>{const r=e.target.closest(".tr[data-id]");if(!r)return;lpFired=false;lpT=setTimeout(()=>{lpFired=true;vib();sheet("more",r.dataset.id)},480)});
["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(lpT)));
document.addEventListener("pointermove",e=>{if(Math.abs(e.movementY)>4||Math.abs(e.movementX)>4)clearTimeout(lpT)});
document.addEventListener("click",e=>{const el=e.target.closest("button,[data-play],[data-open],[data-openpl],[data-themes],#mini");if(!el)return;if(lpFired){lpFired=false;return}const d=el.dataset;
 if(el.id==="mPlay"){e.stopPropagation();toggle();return}if(el.id==="mini"){openFull();return}
 if(d.more){sheet("more",d.more);return}
 if(d.like!==undefined){like(d.like);sheet("more",d.like);return}
 if(d.tab){if(view===d.tab){$("#screen").scrollTo({top:0,behavior:"smooth"});return}go(d.tab,"");return}
 if(d.back!==undefined){back();return}
 if(d.themes!==undefined){sheet("themes");return}
 if(d.act){if(d.act==="import")$("#file").click();else if(d.act==="newpl")newPl();return}
 if(d.play!==undefined){const ids=d.ids.split(","),i=+d.play;if(cur&&cur.id===ids[i])openFull();else playList(ids,i,d.ctx);return}
 if(d.open){openSub(d.open);return}if(d.openpl){closeSheet();openSub(null,d.openpl);return}
 if(d.playall!==undefined){const ids=sub.ids();playList(ids,shuffle?Math.floor(Math.random()*ids.length):0,sub.title);return}
 if(d.shuf!==undefined){shuffle=!shuffle;el.classList.toggle("on",shuffle);playerUI();toast(shuffle?"Перемешивание вкл.":"Перемешивание выкл.");return}
 if(d.lf){libF=d.lf;document.querySelectorAll("[data-lf]").forEach(b=>b.classList.toggle("on",b===el));$("#libb").innerHTML=libBody();markRows();return}
 if(d.clearq!==undefined){q="";$("#q").value="";$("#q").focus();el.style.opacity=0;searchRes();return}
 if(d.theme){ST.theme=d.theme;save();applyTheme();document.querySelectorAll(".thm").forEach(b=>b.classList.toggle("on",b===el));return}
 if(d.sp){vib();setSpeed(+d.sp);drawSpeed(ST.speed,true);return}
 if(d.pitch!==undefined){ST.keepPitch=!ST.keepPitch;save();applySpeed();el.classList.toggle("on",ST.keepPitch);return}
 if(d.addsheet){sheet("addto",d.addsheet);return}
 if(d.newpl!==undefined){newPl(d.newpl);return}
 if(d.addto){const p=ST.playlists.find(x=>x.id===d.addto);if(p.ids.includes(d.tid))p.ids=p.ids.filter(x=>x!==d.tid);else{p.ids.push(d.tid);toast("Добавлено в «"+p.name+"»")}save();sheet("addto",d.tid);return}
 if(d.rmfrom){const p=ST.playlists.find(x=>x.id===sub.pl);p.ids=p.ids.filter(x=>x!==d.rmfrom);save();closeSheet();render(null);return}
 if(d.plmenu){sheet("plmenu",d.plmenu);return}
 if(d.plrename){const p=ST.playlists.find(x=>x.id===d.plrename);const n=prompt("Название:",p.name);if(n){p.name=n;save()}closeSheet();render(null);return}
 if(d.delpl){if(!confirm("Удалить плейлист?"))return;ST.playlists=ST.playlists.filter(p=>p.id!==d.delpl);save();closeSheet();back();return}
 if(d.rename){const t=T(byId(d.rename));const n=prompt("Название:",t.title);if(n===null)return;const a=prompt("Исполнитель:",t.artist);ST.meta[d.rename]={title:n||t.title,artist:a||t.artist};save();closeSheet();if(cur&&cur.id===d.rename){$("#mini b").dataset.id="";playerUI()}render(null);setMeta();return}
 if(d.delsong){if(!confirm("Удалить трек из приложения?"))return;const id=d.delsong;dbDel(id);if(cur&&cur.id===id){audio.pause();queue=queue.filter(x=>x!==id);cur=null;$("#mini").classList.remove("show");closeFull()}tracks=tracks.filter(t=>t.id!==id);ST.liked=ST.liked.filter(x=>x!==id);ST.recent=ST.recent.filter(x=>x!==id);ST.playlists.forEach(p=>p.ids=p.ids.filter(x=>x!==id));save();closeSheet();render(null);return}
});
function newPl(tid){const n=prompt("Название плейлиста:","Мой плейлист "+(ST.playlists.length+1));if(!n)return;const p={id:"p"+Date.now(),name:n,ids:tid?[tid]:[],cover:G(...PAL[Math.floor(Math.random()*9)])};ST.playlists.push(p);save();if(tid){toast("Создан «"+n+"»");closeSheet()}else{closeSheet();openSub(null,p.id)}}
$("#play").innerHTML=sw2(I.play,I.pause);$("#mPlay").innerHTML=sw2(I.playS,I.pauseS);$("#shuf").innerHTML=I.shuf;$("#prev").innerHTML=I.prev;$("#next").innerHTML=I.next;$("#fClose").innerHTML=I.down;$("#fMore").innerHTML=I.more;
$("#play").onclick=toggle;$("#next").onclick=()=>next();$("#prev").onclick=prev;$("#fClose").onclick=closeFull;
$("#fLike").onclick=()=>like(cur&&cur.id);$("#fMore").onclick=()=>cur&&sheet("more",cur.id);$("#spBtn").onclick=()=>sheet("speed");
$("#shuf").onclick=()=>{shuffle=!shuffle;playerUI();toast(shuffle?"Перемешивание вкл.":"Перемешивание выкл.")};
$("#rep").onclick=()=>{repeat=(repeat+1)%3;playerUI();toast(["Повтор выкл.","Повтор всех","Повтор трека"][repeat])};
// жесты: свайп обложки — трек, перетаскивание плеера вниз — свернуть (с пальцем)
(()=>{const f=$("#full");let x0,y0,dy=0,mode=null;
 f.addEventListener("touchstart",e=>{if(e.target.closest(".prog,button"))return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;mode=null;dy=0},{passive:true});
 f.addEventListener("touchmove",e=>{if(x0==null)return;const dx=e.touches[0].clientX-x0;dy=e.touches[0].clientY-y0;if(!mode&&(Math.abs(dx)>10||Math.abs(dy)>10))mode=Math.abs(dy)>Math.abs(dx)?"v":"h";
  if(mode==="v"&&dy>0){f.style.transition="none";f.style.transform=`translateY(${dy}px)`}else if(mode==="h"){$("#fcover").style.transition="none";$("#fcover").style.transform=`translateX(${dx*.6}px) rotate(${dx*.02}deg)`}},{passive:true});
 f.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;f.style.transition="";$("#fcover").style.transition="";$("#fcover").style.transform="";
  if(mode==="v"){f.style.transform="";if(dy>120)closeFull()}else if(mode==="h"&&Math.abs(dx)>70){dx<0?next():prev()}x0=null})})();
(()=>{const m=$("#mini");let x0,dx=0;m.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;dx=0},{passive:true});
 m.addEventListener("touchmove",e=>{dx=e.touches[0].clientX-x0;$("#mini .m").style.transition="none";$("#mini .m").style.transform=`translateX(${dx*.5}px)`;$("#mini .m").style.opacity=1-Math.min(.7,Math.abs(dx)/200)},{passive:true});
 m.addEventListener("touchend",()=>{const s=$("#mini .m");s.style.transition="";s.style.transform="";s.style.opacity="";if(Math.abs(dx)>60){lpFired=true;setTimeout(()=>lpFired=false,60);dx<0?next():prev()}})})();
let tap=0;$("#fcover").addEventListener("click",()=>{if(Date.now()-tap<300&&cur)like(cur.id);tap=Date.now()});
$("#file").onchange=e=>{const fs=[...e.target.files];let n=0;fs.forEach((f,i)=>{if(!f.type.startsWith("audio")&&!/\.(mp3|m4a|aac|wav|ogg|flac|opus)$/i.test(f.name))return;const id="f"+Date.now()+i,c=PAL[Math.floor(Math.random()*9)];
 let title=f.name.replace(/\.[^.]+$/,""),artist="Неизвестный исполнитель";const m=title.match(/^(.+?)\s+[-–—]\s+(.+)$/);if(m){artist=m[1];title=m[2]}
 const rec={id,title,artist,blob:f,c,added:Date.now()+i};dbPut(rec);tracks.push(mk(rec));n++});e.target.value="";toast(n?"Добавлено: "+n:"Аудиофайлы не найдены");if(n){libF="mine";view="lib";sub=null;render("")}};
if("mediaSession" in navigator){const ms=navigator.mediaSession;[["play",toggle],["pause",toggle],["nexttrack",()=>next()],["previoustrack",prev],["seekto",d=>audio.currentTime=d.seekTime]].forEach(([k,f])=>{try{ms.setActionHandler(k,f)}catch(e){}})}
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveLast()});
const mk=r=>({id:r.id,title:r.title,artist:r.artist,url:URL.createObjectURL(r.blob),cover:G(...r.c),color:r.c[0],demo:r.demo,emoji:r.emoji,added:r.added||0});

// ---------- запуск ----------
(async()=>{applyTheme();playerUI();$("#screen").innerHTML=`<p class="empty" style="padding-top:35vh">Загрузка…</p>`;await idb();const saved=await dbAll();
 for(let i=0;i<DEMO.length;i++){tracks.push(mk({id:"d"+i,title:DEMO[i][0],artist:DEMO[i][1],blob:await synth(i),c:PAL[i],demo:true,emoji:DEMO[i][6]}))}
 saved.sort((a,b)=>a.added-b.added).forEach(r=>tracks.push(mk(r)));
 if(!ST.playlists.length){ST.playlists=[{id:"p1",name:"Ночной драйв",ids:["d0","d2","d4"],cover:G(...PAL[6])},{id:"p2",name:"Чилл",ids:["d1","d3","d5"],cover:G(...PAL[8])}];save()}
 const L=ST.last;if(L&&byId(L.id)){queue=(L.queue||[]).filter(byId);qi=Math.max(0,queue.indexOf(L.id));if(!queue.length){queue=[L.id];qi=0}ctxName=L.ctxName||"";loadT(byId(L.id),false,L.pos)}
 render("")})();
</script>
